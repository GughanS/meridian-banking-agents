version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - LLM_PROVIDER=mock
      - DATABASE_URL=sqlite+aiosqlite:///meridian.db
      - CORE_BASE_URL=http://localhost:8001/mock-core/v1
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

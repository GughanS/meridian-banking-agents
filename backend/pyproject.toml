[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "faker>=40.43.0",
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.14.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
ignore_errors = true

